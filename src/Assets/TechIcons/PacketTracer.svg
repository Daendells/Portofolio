<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle with Cisco blue -->
  <circle cx="50" cy="50" r="50" fill="#1BA0D7"/>
  
  <!-- Network nodes - representing Packet Tracer's network simulation -->
  <!-- Central router/switch -->
  <rect x="38" y="38" width="24" height="24" rx="4" fill="white" opacity="0.95"/>
  <rect x="42" y="44" width="16" height="3" rx="1.5" fill="#1BA0D7"/>
  <rect x="42" y="50" width="16" height="3" rx="1.5" fill="#1BA0D7"/>
  <rect x="42" y="56" width="10" height="3" rx="1.5" fill="#1BA0D7"/>

  <!-- Top node -->
  <circle cx="50" cy="18" r="7" fill="white" opacity="0.9"/>
  <circle cx="50" cy="18" r="4" fill="#1BA0D7"/>
  
  <!-- Left node -->
  <circle cx="18" cy="50" r="7" fill="white" opacity="0.9"/>
  <circle cx="18" cy="50" r="4" fill="#1BA0D7"/>

  <!-- Right node -->
  <circle cx="82" cy="50" r="7" fill="white" opacity="0.9"/>
  <circle cx="82" cy="50" r="4" fill="#1BA0D7"/>

  <!-- Bottom node -->
  <circle cx="50" cy="82" r="7" fill="white" opacity="0.9"/>
  <circle cx="50" cy="82" r="4" fill="#1BA0D7"/>

  <!-- Connecting lines -->
  <line x1="50" y1="25" x2="50" y2="38" stroke="white" stroke-width="2.5" stroke-dasharray="3,2"/>
  <line x1="25" y1="50" x2="38" y2="50" stroke="white" stroke-width="2.5" stroke-dasharray="3,2"/>
  <line x1="62" y1="50" x2="75" y2="50" stroke="white" stroke-width="2.5" stroke-dasharray="3,2"/>
  <line x1="50" y1="62" x2="50" y2="75" stroke="white" stroke-width="2.5" stroke-dasharray="3,2"/>
</svg>
